version: "3.9"

services:
  # ─── PostgreSQL 数据库 ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: baby-cry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       baby_cry_app
      POSTGRES_USER:     ${DB_USER:-babycry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # 仅开发环境暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-babycry} -d baby_cry_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 后端 API ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baby-cry-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3000
      DATABASE_URL:   postgresql://${DB_USER:-babycry}:${DB_PASSWORD}@db:5432/baby_cry_app
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAX_FILE_SIZE:  ${MAX_FILE_SIZE:-10485760}
      LOG_LEVEL:      ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Nginx 反向代理（可选，生产环境建议启用）────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: baby-cry-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    profiles:
      - production   # docker compose --profile production up

volumes:
  pgdata:
  uploads:
